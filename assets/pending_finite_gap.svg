<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="pending-finite-title pending-finite-desc">
<title id="pending-finite-title">有限loss可以跨过非有限路由状态</title>
<desc id="pending-finite-desc">人工CPU三专家模型，原训练闭包执行三步。所有loss有限；异常pending或中心化溢出可使下一步bias非有限。第三步状态重新有限但参数已偏离参照。</desc>
<rect width="1200" height="560" fill="#f8fafc"/>
<text x="24" y="38" font-family="system-ui,sans-serif" font-size="26" fill="#18344b">loss 有限，不等于路由状态健康</text>
<text x="24" y="67" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">人工 beta 注入 · 原 train_step / setter / route · 非 Hero 事故或误差估计</text>
<text x="24" y="110" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">控制</text>
<text x="280" y="110" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">第 1 步：输出注入 beta</text>
<text x="585" y="110" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">第 2 步：使用该 beta</text>
<text x="890" y="110" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">第 3 步：再次有限</text>
<text x="24" y="169" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">有限 beta 参照</text>
<rect x="270" y="132" width="294" height="75" rx="6" fill="#e6f1eb"/>
<text x="280" y="155" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">loss 8.656469</text>
<text x="280" y="177" font-family="system-ui,sans-serif" font-size="15" fill="#18344b">P / stored / next: Y / Y / Y</text>
<text x="280" y="198" font-family="system-ui,sans-serif" font-size="15" fill="#215f55">参数与参照相同</text>
<rect x="575" y="132" width="294" height="75" rx="6" fill="#e6f1eb"/>
<text x="585" y="155" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">loss 0.372697</text>
<text x="585" y="177" font-family="system-ui,sans-serif" font-size="15" fill="#18344b">P / stored / next: Y / Y / Y</text>
<text x="585" y="198" font-family="system-ui,sans-serif" font-size="15" fill="#215f55">参数与参照相同</text>
