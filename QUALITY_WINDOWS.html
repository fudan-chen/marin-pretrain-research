<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BME评分窗口：观察范围</title><style>
body{font:16px/1.65 system-ui,sans-serif;color:#163447;background:#fff;margin:0;padding:18px;box-sizing:border-box}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0}label{display:block;font-weight:600}input{width:min(100%,660px)}select{font-size:16px;padding:6px}.bar{height:26px;position:relative;background:#e8eef2;border-radius:4px;margin:9px 0;overflow:hidden}.segment{position:absolute;top:0;bottom:0;background:#226b95}.mid{background:#b07819}.end{background:#66824e}.caption{font-size:14px;color:#485f70}.note{background:#eef5f8;padding:10px;border-left:3px solid #226b95}output{font-weight:700}button{padding:7px 12px;margin:6px 8px 6px 0;font-size:15px;border:1px solid #abc;background:white;border-radius:4px}button[aria-pressed=true]{background:#deedf5}#stats{font-variant-numeric:tabular-nums}svg{display:block;width:100%;height:auto}pre{white-space:pre-wrap;font-size:13px}
</style><h1>BME评分到底观察了文档的哪些部分？</h1><p>按归档源码的<strong>字符切片</strong>规则绘制。这里不运行分词器或质量模型，字符覆盖率不等于token覆盖率。</p>
<label for="qlength">文档字符数：<output id="qlength-value">10000</output></label><input id="qlength" type="range" min="1000" max="40000" step="1" value="10000">
<div><button data-length="2000">2000：单窗口</button><button data-length="2001">2001：重复窗口</button><button data-length="3000">3000：重叠</button><button data-length="10000">10000：有盲区</button><button data-length="20000">20000：更长文档</button></div>
<div class="caption">开头窗口</div><div class="bar" id="qbegin"></div><div class="caption">中间窗口</div><div class="bar" id="qmiddle"></div><div class="caption">结尾窗口</div><div class="bar" id="qend"></div><p id="stats" aria-live="polite"></p>
<p class="caption">窗口覆盖的字符并集（深色）；浅色部分未进入这些窗口。</p><div class="bar" id="qunion"></div><p class="note" id="qmeaning"></p>
<p>三个窗口等权平均分数；重叠字符会重复进入模型，不能把它理解成全文逐字符等权评分。实际评分还会分词、截断并映射低频token到UNK。</p><details><summary>查看切片与证据边界</summary><pre id="qjson"></pre><p>源码：Marin 84869ae8… / fast_transformer/scorer.py。人工窗口示意，没有真实模型评分、真实缓存或历史执行绑定。</p></details><script>(function(root){
  function windowsFor(n){
    if(!Number.isSafeInteger(n)||n<1)throw new Error('字符数必须是正整数');
    if(n<=2000)return [[0,n]];
    const m=Math.floor(n/2);return [[0,2000],[Math.max(0,m-1000),m+1000],[n-2000,n]];
  }
  function coverage(n){
    const spans=windowsFor(n), sorted=spans.slice().sort((a,b)=>a[0]-b[0]);let total=0,last=0;
    for(const [a,b] of sorted){total+=Math.max(0,b-Math.max(a,last));last=Math.max(last,b);}
    return {spans,covered:total,fraction:total/n};
  }
  const api={windowsFor,coverage};if(typeof module==='object'&&module.exports)module.exports=api;else root.QualityWindows=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>
const slider=document.getElementById('qlength');function render(){const n=Number(slider.value),r=QualityWindows.coverage(n);document.getElementById('qlength-value').value=n;['qbegin','qmiddle','qend'].forEach((id,i)=>{const bar=document.getElementById(id);bar.replaceChildren();if(r.spans[i]){const [a,b]=r.spans[i],s=document.createElement('span');s.className='segment '+['','mid','end'][i];s.style.left=100*a/n+'%';s.style.width=100*(b-a)/n+'%';bar.append(s);bar.setAttribute('aria-label',a+'至'+b+'字符（半开区间）');}else bar.setAttribute('aria-label','该文档只有一个窗口');});const u=document.getElementById('qunion');u.replaceChildren();for(const[a,b]of r.spans){const s=document.createElement('span');s.className='segment';s.style.left=100*a/n+'%';s.style.width=100*(b-a)/n+'%';u.append(s);}document.getElementById('stats').textContent=r.spans.length+'个窗口；唯一覆盖 '+r.covered+' / '+n+' 字符（'+(100*r.fraction).toFixed(2)+'%）；未覆盖 '+(n-r.covered)+' 字符。';document.getElementById('qmeaning').textContent=n<=2000?'短文档只有一个窗口。':n===2001?'开头与中间切片完全相同；同一段文本被打分两次。':r.covered<n?'存在未被窗口观察的区间；那些区间的改变可以不改变送入评分器的文本。':'字符并集覆盖全文，但窗口重叠；窗口均分仍不等于全文均匀评分。';document.getElementById('qjson').textContent=JSON.stringify({characters:n,half_open_spans:r.spans,unique_characters:r.covered,character_coverage:r.fraction,real_model_result:null},null,2);document.querySelectorAll('[data-length]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.length)===n)));}slider.addEventListener('input',render);document.querySelectorAll('[data-length]').forEach(b=>b.addEventListener('click',()=>{slider.value=b.dataset.length;render();}));render();
</script></html>
