<text x="890" y="198" font-family="system-ui,sans-serif" font-size="15" fill="#215f55">参数与参照相同</text>
<text x="24" y="254" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">注入一个 NaN beta</text>
<rect x="270" y="217" width="294" height="75" rx="6" fill="#fff0df"/>
<text x="280" y="240" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">loss 8.656469</text>
