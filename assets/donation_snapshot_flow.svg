<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="donation-snapshot-title donation-snapshot-desc"><title id="donation-snapshot-title">保存快照与下一次 donation 的所有权时序</title><desc id="donation-snapshot-desc">原 helper 先建立私有 NumPy 副本。下一次训练更新复用旧输入。延迟消费者读取副本。本地 CPU 实验旧输入已失效而快照仍为旧值；GPU 与完整恢复未验证。</desc><rect width="960" height="330" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b4d"><text x="24" y="34" font-size="22">先取得独立快照，再让训练复用输入</text><text x="24" y="66" font-size="15">固定原 helper；真实单 CPU donation；消费者由事件门控</text><g stroke="#4f7094" fill="#e6eff8"><rect x="24" y="100" width="210" height="82" rx="10"/><rect x="270" y="100" width="210" height="82" rx="10"/><rect x="516" y="100" width="180" height="82" rx="10"/><rect x="732" y="100" width="204" height="82" rx="10"/></g><g font-size="17"><text x="40" y="130">完成更新的 state</text><text x="40" y="159">旧首值 0</text><text x="286" y="130">原 helper 私有复制</text><text x="286" y="159">NumPy 快照首值 0</text><text x="532" y="130">两次 donation</text><text x="532" y="159">新首值 200</text><text x="748" y="130">放行延迟消费者</text><text x="748" y="159">保存首值仍为 0</text></g><g stroke="#4f7094" stroke-width="2"><path d="M234 140h36m210 0h36m180 0h36"/></g><text x="24" y="224" font-size="17">实测两组旧输入 deleted=True；完整快照与更新前数组相等。</text><text x="24" y="257" font-size="16">观察对照：保留外部 host 视图时未发生 donation，不能算作 donation 验收。</text><text x="24" y="292" font-size="16">仍待验证：GPU DMA / pinned allocator / TensorStore commit / 多 rank / 完整训练恢复。</text></g></svg>