<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="pending-resume-title pending-resume-desc">
<title id="pending-resume-title">原训练步的 pending 与恢复对照</title>
<desc id="pending-resume-desc">人工三专家 CPU 模型。完整恢复和保留 pending 的预写入等价；清空 pending 后原 setter 把 bias 重设为零，改变路由及更新。数值不是 Hero 误差。</desc>
<rect width="1200" height="480" fill="#f8fafc"/>
<text x="28" y="36" font-family="system-ui,sans-serif" font-size="25" fill="#18344b">恢复验收必须走到下一次原训练更新</text>
<text x="28" y="65" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">人工三专家 · 固定 logits · 原 QB setter / route / train_step · 真实 Adam 与本地 OCDBT</text>
<text x="28" y="112" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">恢复/操作方式</text>
<text x="350" y="112" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">下一步 bias</text>
<text x="600" y="112" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">所选专家 ID</text>
<text x="795" y="112" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">训练 loss</text>
<text x="1010" y="112" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">对参照更新</text>
<rect x="20" y="121" width="1160" height="43" rx="5" fill="#e6f1eb"/>
<text x="28" y="146" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">不中断参照</text>
<text x="350" y="146" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[1.0, -2.0, 1.0]</text>
<text x="600" y="146" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[0, 2]</text>
<text x="795" y="146" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">0.719078</text>
<text x="1010" y="146" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">一致</text>
<rect x="20" y="169" width="1160" height="43" rx="5" fill="#e6f1eb"/>
<text x="28" y="194" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">完整恢复</text>
<text x="350" y="194" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[1.0, -2.0, 1.0]</text>
<text x="600" y="194" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[0, 2]</text>
<text x="795" y="194" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">0.719078</text>
<text x="1010" y="194" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">一致</text>
<rect x="20" y="217" width="1160" height="43" rx="5" fill="#fff0df"/>
<text x="28" y="242" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">只清空 pending</text>
<text x="350" y="242" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[-0.0, -0.0, -0.0]</text>
<text x="600" y="242" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[1, 0]</text>
<text x="795" y="242" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">19.130568</text>
<text x="1010" y="242" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">改变</text>
<rect x="20" y="265" width="1160" height="43" rx="5" fill="#e6f1eb"/>
<text x="28" y="290" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">先写入 bias，保留 pending</text>
<text x="350" y="290" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[1.0, -2.0, 1.0]</text>
<text x="600" y="290" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[0, 2]</text>
<text x="795" y="290" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">0.719078</text>
<text x="1010" y="290" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">一致</text>
<rect x="20" y="313" width="1160" height="43" rx="5" fill="#fff0df"/>
<text x="28" y="338" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">先写入 bias，再清空 pending</text>
<text x="350" y="338" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[-0.0, -0.0, -0.0]</text>
<text x="600" y="338" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">[1, 0]</text>
<text x="795" y="338" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">19.130568</text>
<text x="1010" y="338" font-family="system-ui,sans-serif" font-size="17" fill="#18344b">改变</text>
<text x="28" y="407" font-family="system-ui,sans-serif" font-size="18" fill="#18344b">零 pending 不是“不做更新”：原函数始终用 -beta 并中心化，替换 router bias。</text>
<text x="28" y="444" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">另行记录：原初始化 EMA 共享缓冲区在本 CPU donation 路径报错；归档 Hero EMA 关闭。</text>
</svg>
