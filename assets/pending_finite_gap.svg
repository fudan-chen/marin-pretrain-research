<text x="24" y="518" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">原 loss-only 检查接受全部 12 步；P = pending 输入有限性，stored / next = 两种 bias 视图有限性。</text>
<text x="24" y="545" font-family="system-ui,sans-serif" font-size="16" fill="#18344b">绿色仅表示三个有限性标志通过，不证明过去更新正确；图中数值是人工平方误差。</text>
</svg>
