<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="seed-pipeline-title seed-pipeline-desc"><title id="seed-pipeline-title">未来域前置时提前占用当前 shuffle key</title><desc id="seed-pipeline-desc">本地原函数控制。基线 A领取第一个key，B领取第二个key；未来正权重X置于前面时，X领取第一个key，A改用第二个，B用第三个。当前X未采样，当前域名槽序列不变，96个内容身份改变92个。始终零X被过滤，不占key。</desc><rect width="960" height="360" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b4d"><text x="24" y="35" font-size="22">未来域尚未采样，当前域的 shuffle key 已经重新分配</text><text x="24" y="66" font-size="16">人工 identity store；原 seed / train_sets / key_iterator / Feistel / mix；非生产 token</text><text x="24" y="105" font-size="18">基线构造顺序 A → B</text><text x="490" y="105" font-size="18">未来 X 前置：X → A → B</text><rect x="24" y="125" width="442" height="36" rx="6" fill="#e1ecf8"/><text x="36" y="149" font-size="16">A → [3254170493, 2583240948]</text><rect x="24" y="173" width="442" height="36" rx="6" fill="#e1ecf8"/><text x="36" y="197" font-size="16">B → [3972956925, 984894047]</text><rect x="490" y="125" width="442" height="36" rx="6" fill="#fff0d8"/><text x="502" y="149" font-size="16">X → [3254170493, 2583240948]</text><rect x="490" y="173" width="442" height="36" rx="6" fill="#e1ecf8"/><text x="502" y="197" font-size="16">A → [3972956925, 984894047]</text><rect x="490" y="221" width="442" height="36" rx="6" fill="#e1ecf8"/><text x="502" y="245" font-size="16">B → [2974936723, 3467811286]</text><text x="24" y="289" font-size="17">当前 A/B 域名槽序列相同；完整库存相同；前96槽内容身份改变92处。</text><text x="24" y="325" font-size="16">始终零权重X被过滤；末尾追加在本例保持旧key。实际前缀仍须用 token hash 验收。</text></g></svg>