<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="resume-update-title resume-update-desc"><title id="resume-update-title">同权重恢复后的首次参数更新</title><desc id="resume-update-desc">人工三参数 quadratic 与真实 Adam。更新前损失相同，完整恢复与仅权重初始化的参数增量不同。图中所有条形共享坐标尺，范围负零点零一到正零点零一；不是 Hero 模型结果。</desc><rect width="960" height="350" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b4d"><text x="24" y="34" font-size="22">同权重、同输入、同更新前 loss，不保证下一次更新相同</text><text x="24" y="65" font-size="16">人工三参数 quadratic / 真实 Adam / 原恢复函数 / 本地 OCDBT</text><text x="24" y="100" font-size="16" fill="#215f9a">蓝：完整恢复</text><text x="200" y="100" font-size="16" fill="#b26416">橙：仅权重初始化</text><text x="24" y="147" font-size="17">坐标 1</text><line x1="470" x2="470" y1="127" y2="169" stroke="#64748b"/><rect x="419.295" y="135" width="50.705" height="14" fill="#215f9a"/><text x="790" y="147" font-size="15">-0.001810908</text><rect x="190.000" y="154" width="280.000" height="14" fill="#b26416"/><text x="790" y="166" font-size="15">-0.009999990</text><text x="24" y="202" font-size="17">坐标 2</text><line x1="470" x2="470" y1="182" y2="224" stroke="#64748b"/><rect x="470.000" y="190" width="210.679" height="14" fill="#215f9a"/><text x="790" y="202" font-size="15">+0.007524252</text><rect x="470.000" y="209" width="280.000" height="14" fill="#b26416"/><text x="790" y="221" font-size="15">+0.009999990</text><text x="24" y="257" font-size="17">坐标 3</text><line x1="470" x2="470" y1="237" y2="279" stroke="#64748b"/><rect x="254.468" y="245" width="215.532" height="14" fill="#215f9a"/><text x="790" y="257" font-size="15">-0.007697582</text><rect x="190.000" y="264" width="280.000" height="14" fill="#b26416"/><text x="790" y="276" font-size="15">-0.009999990</text><text x="175" y="307" font-size="15">−0.01</text><text x="462" y="307" font-size="15">0</text><text x="727" y="307" font-size="15">+0.01</text><text x="24" y="337" font-size="15">仅权重初始化下一条 loss 更低，是本次局部反例；不表示长期收益，也不是 Hero 配比结论。</text></g></svg>