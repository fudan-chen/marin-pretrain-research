<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 420" role="img" aria-labelledby="loss-mass-title loss-mass-desc"><title id="loss-mass-title">序列份额与计分权重份额</title><desc id="loss-mass-desc">人工每域长度4，A每序列权重和3，B为1。序列各半时目标系数75%和25%；序列25%和75%时目标系数各半。均为8条序列32个名义位置，计分权重和分别16和12。不是Hero密度或硬件收益。</desc><rect width="990" height="420" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b4d"><text x="24" y="34" font-size="22">“50%配比”先问分母：序列，还是计分权重？</text><text x="24" y="68" font-size="16">人工CPU控制：A每序列3个权重，B每序列1个；蓝=A，橙=B。</text><text x="24" y="124" font-size="17">等量采样：序列份额</text><rect x="310.000" y="100" width="300.000" height="36" fill="#215f9a"/><text x="460.000" y="124" text-anchor="middle" fill="white" font-size="17">50%</text><rect x="610.000" y="100" width="300.000" height="36" fill="#c77721"/><text x="760.000" y="124" text-anchor="middle" fill="white" font-size="17">50%</text><text x="24" y="184" font-size="17">相应计分：权重份额</text><rect x="310.000" y="160" width="450.000" height="36" fill="#215f9a"/><text x="535.000" y="184" text-anchor="middle" fill="white" font-size="17">75%</text><rect x="760.000" y="160" width="150.000" height="36" fill="#c77721"/><text x="835.000" y="184" text-anchor="middle" fill="white" font-size="17">25%</text><text x="24" y="244" font-size="17">反密度候选：序列份额</text><rect x="310.000" y="220" width="150.000" height="36" fill="#215f9a"/><text x="385.000" y="244" text-anchor="middle" fill="white" font-size="17">25%</text><rect x="460.000" y="220" width="450.000" height="36" fill="#c77721"/><text x="685.000" y="244" text-anchor="middle" fill="white" font-size="17">75%</text><text x="24" y="304" font-size="17">相应计分：权重份额</text><rect x="310.000" y="280" width="300.000" height="36" fill="#215f9a"/><text x="460.000" y="304" text-anchor="middle" fill="white" font-size="17">50%</text><rect x="610.000" y="280" width="300.000" height="36" fill="#c77721"/><text x="760.000" y="304" text-anchor="middle" fill="white" font-size="17">50%</text><text x="24" y="367" font-size="16">同为32个名义输入位置；计分权重和16→12，不等于学习效率或硬件成本改变25%。</text><text x="24" y="399" font-size="16">本例初始loss都为ln2。目标系数不同仍可能看不出loss跳变；真实域密度必须另测。</text></g></svg>